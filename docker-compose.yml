services:
  db:
    build:
      context: ./server/db
    image: skt-db:local
    container_name: skt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skt
      POSTGRES_PASSWORD: skt
      POSTGRES_DB: skt_orders
    volumes:
      - skt_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skt -d skt_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: skt-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: skt
      PGPASSWORD: skt
      PGDATABASE: skt_orders
      PORT: 3000
      GOOGLE_APPS_SCRIPT_URL: ${GOOGLE_APPS_SCRIPT_URL:-https://script.google.com/macros/s/AKfycbznbYg8u5ysQkqmfPkCHt8e8xoDU0MsbQKUsheV5Ha2ZxlCTk3gZL_T4pBr5P_zuYgWvA/exec}
      SHOP_NAME:    ${SHOP_NAME:-SKT Order Book}
      SHOP_TAGLINE: ${SHOP_TAGLINE:-Construction Materials — Cement & Steel}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-—}
      SHOP_PHONE:   ${SHOP_PHONE:-—}
      SHOP_EMAIL:   ${SHOP_EMAIL:-}
      SHOP_GSTIN:   ${SHOP_GSTIN:-}
    ports:
      - "3000:3000"

volumes:
  skt_pgdata:
